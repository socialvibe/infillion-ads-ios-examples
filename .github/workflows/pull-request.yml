name: Pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version increment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          setting_from_file() {
            awk -v key="$1" '$1 == key && $2 == "=" { print $3 }' Version.xcconfig
          }

          base_settings="$(git show "${BASE_SHA}:Version.xcconfig")"
          setting_from_base() {
            printf '%s\n' "$base_settings" | awk -v key="$1" '$1 == key && $2 == "=" { print $3 }'
          }

          base_code="$(setting_from_base VERSION_CODE)"
          current_code="$(setting_from_file VERSION_CODE)"
          base_name="$(setting_from_base VERSION_NAME)"
          current_name="$(setting_from_file VERSION_NAME)"

          [[ "$base_code" =~ ^[0-9]+$ && "$current_code" =~ ^[0-9]+$ ]] || {
            echo "VERSION_CODE must be an integer."
            exit 1
          }
          (( current_code == base_code + 1 )) || {
            echo "VERSION_CODE must increase by exactly one: ${base_code} -> $((base_code + 1))."
            exit 1
          }

          [[ "$base_name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || {
            echo "Base VERSION_NAME must use MAJOR.MINOR.PATCH."
            exit 1
          }
          base_major="${BASH_REMATCH[1]}"
          base_minor="${BASH_REMATCH[2]}"
          base_patch="${BASH_REMATCH[3]}"

          [[ "$current_name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || {
            echo "VERSION_NAME must use MAJOR.MINOR.PATCH."
            exit 1
          }
          current_major="${BASH_REMATCH[1]}"
          current_minor="${BASH_REMATCH[2]}"
          current_patch="${BASH_REMATCH[3]}"

          (( current_major == base_major &&
             current_minor == base_minor &&
             current_patch == base_patch + 1 )) || {
            echo "VERSION_NAME must increase by exactly one patch: ${base_name} -> ${base_major}.${base_minor}.$((base_patch + 1))."
            exit 1
          }

  unit-tests:
    name: Unit tests
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run unit tests
        run: |
          set -euo pipefail

          simulator_id="$(xcrun simctl list devices available --json |
            python3 -c 'import json, sys; devices = json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime, items in devices.items() if "iOS" in runtime for d in items if d["name"].startswith("iPhone")))')"

          xcodebuild test \
            -project swift-ios-app/InfillionAdsExamples.xcodeproj \
            -scheme InfillionAdsExamples \
            -destination "id=${simulator_id}" \
            -resultBundlePath build/UnitTests.xcresult \
            -skipMacroValidation \
            -skipPackagePluginValidation

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: build/UnitTests.xcresult
          if-no-files-found: warn
